# Dependabot is GitHub's built-in SCA + updater. Once this file is on your
# default branch, GitHub automatically opens pull requests to bump vulnerable or
# outdated dependencies. It covers three ecosystems in this repo: Python
# packages, the Docker base image, and the GitHub Actions you pin above.
#
# Enable "Dependabot alerts" and "Dependabot security updates" under
# Settings > Code security for the alerting side (free on public repos).

version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/app"
    schedule:
      interval: "weekly"
    # Group all Python bumps into ONE PR. Separate PRs conflict with each
    # other's pins (e.g. Flask 3.x needs Werkzeug 3.x, so a lone Flask bump
    # can't install and breaks the Docker build).
    groups:
      python-deps:
        patterns: ["*"]

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns: ["*"]
